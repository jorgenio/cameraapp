name: Android APK

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compilar APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Gradle (cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Aceptar licencias e instalar paquetes SDK
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" "platform-tools" > /dev/null

      - name: Permisos del wrapper
        run: chmod +x gradlew

      - name: Compilar APK debug
        run: ./gradlew --no-daemon assembleDebug

      - name: Compilar APK release (sin firmar)
        run: ./gradlew --no-daemon assembleRelease

      - name: Preparar artefactos
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/cameraapp-debug.apk
          cp app/build/outputs/apk/release/app-release-unsigned.apk out/cameraapp-release-unsigned.apk

      - name: Subir artefactos
        uses: actions/upload-artifact@v4
        with:
          name: cameraapp-apk
          path: android/out/*.apk
          retention-days: 30

      - name: Adjuntar APK al release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android/out/cameraapp-debug.apk
            android/out/cameraapp-release-unsigned.apk
          fail_on_unmatched_files: true
